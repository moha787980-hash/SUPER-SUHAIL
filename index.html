<style>
:root{--bg:#EEF1F8;--card:#fff;--ink:#121A33;--muted:#5C6684;--line:#DCE2EF;--blue:#14307A;--blue2:#2851A8;--gold:#D9A733;--red:#C8182A;--ok:#1C8A4A;--f:"Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;--n:ui-monospace,"SF Mono",Menlo,Consolas,monospace}
@media (prefers-color-scheme:dark){:root{--bg:#0B1124;--card:#141C36;--ink:#EEF1F8;--muted:#98A2C0;--line:#26304F}}
[hidden]{display:none!important}*{box-sizing:border-box}html,body{margin:0}body{background:var(--bg);color:var(--ink);font:15px/1.4 var(--f);padding-bottom:calc(76px + env(safe-area-inset-bottom))}
header{background:linear-gradient(160deg,#1C3E95,#0E2160);color:#fff;padding:calc(14px + env(safe-area-inset-top)) 16px 14px;position:sticky;top:0;z-index:5;border-bottom:3px solid var(--gold)}
header .r{display:flex;align-items:center;justify-content:space-between;gap:10px}
header .lg{height:58px;width:auto;flex:none;filter:drop-shadow(0 2px 4px rgba(0,0,0,.35))}header h1{margin:0;font-size:19px;letter-spacing:.02em}#sub{font-size:12.5px;opacity:.85;margin-top:2px}
.hb{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.3);color:#fff;border-radius:10px;padding:8px 12px;font:600 14px var(--f)}
main{padding:12px;display:grid;gap:12px;max-width:720px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;display:grid;gap:10px}
.card h2{margin:0;font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.list{display:grid}.li{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:10px 0;border-top:1px solid var(--line)}.li:first-child{border-top:0}
.li .s{grid-column:1/-1;font-size:12.5px;color:var(--muted)}.li .nm{min-width:0;overflow-wrap:anywhere;font-weight:600}
.num{font-family:var(--n);font-variant-numeric:tabular-nums}.bad{color:var(--red)}.ok{color:var(--ok)}
.empty{color:var(--muted);text-align:center;padding:12px}
.msgs{display:grid;gap:8px}.m{max-width:85%;padding:9px 12px;border-radius:14px;background:var(--bg);display:grid;gap:2px}
.m.me{justify-self:end;background:var(--blue2);color:#fff}.m.boss{border:2px solid var(--gold)}
.m small{font-size:11.5px;opacity:.75}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);padding-bottom:env(safe-area-inset-bottom);z-index:5}
nav button{background:none;border:0;color:var(--muted);font:600 11.5px var(--f);padding:8px 2px 10px;display:grid;justify-items:center;gap:3px;position:relative}
nav button svg{width:24px;height:24px}nav button[aria-current=true]{color:var(--blue2)}
@media (prefers-color-scheme:dark){nav button[aria-current=true]{color:var(--gold)}}
.dot{position:absolute;top:4px;left:calc(50% + 6px);background:var(--red);color:#fff;font-size:10.5px;border-radius:999px;padding:1px 6px}
input,textarea{width:100%;font:16px var(--f);padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink)}
label{font-size:13px;font-weight:600;color:var(--muted)}
.btn{background:var(--blue);color:#fff;border:0;border-radius:10px;padding:13px 16px;font:700 15px var(--f);width:100%}.btn.sec{background:var(--bg);color:var(--ink);border:1px solid var(--line)}.btn:disabled{opacity:.6}
.chips{display:flex;flex-wrap:wrap;gap:8px}.chips button{border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:999px;padding:9px 14px;font:600 14px var(--f)}
.chips button[aria-pressed=true]{background:var(--blue);color:#fff;border-color:var(--blue)}
.pinshow{font:700 30px var(--n);text-align:center;letter-spacing:.3em;min-height:40px}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.pad button{font:600 22px var(--n);padding:14px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
.stale{background:#FFF4D6;color:#7A5300;border:1px solid #F0D58A;border-radius:10px;padding:10px;font-size:13.5px}
.price{font:700 22px var(--n);color:var(--blue2)}@media (prefers-color-scheme:dark){.price{color:var(--gold)}}
.row{display:flex;gap:8px}.row>*{flex:1}
.hero{background:linear-gradient(160deg,#E0262F,#9E0F18);color:#fff;border:0;border-bottom:4px solid var(--gold)}.hero h2{color:#fff;opacity:.9}.hero .t{font:800 26px/1.15 var(--f);margin:0}
.big input{font:700 22px var(--f);padding:14px}.big label{font-size:14px}.btn.xl{font-size:20px;padding:18px;background:var(--red)}
.qty{display:grid;grid-template-columns:64px 1fr 64px;gap:8px;align-items:center}.qty button{font:700 30px var(--f);height:58px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}.qty b{text-align:center;font:800 30px var(--n)}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#121A33;color:#fff;padding:10px 16px;border-radius:10px;font-size:14px;z-index:9;max-width:90vw;text-align:center}

<script>
"use strict";
const NTFY="https://ntfy.sh/";
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const st={get:k=>{try{return localStorage.getItem(k)}catch(e){return null}},set:(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}},del:k=>{try{localStorage.removeItem(k)}catch(e){}}};
const LOCK="HAKIM";let cfg=null;try{cfg=JSON.parse(st.get("sw_cfg")||"null")}catch(e){}
let me=null;try{me=JSON.parse(st.get("sw_me")||"null")}catch(e){}
let data=null;try{data=JSON.parse(st.get("sw_last")||"null")}catch(e){}
let view="per",err="",pickU=LOCK,pin="",results=null,busy=false,falta=[];
const esc=t=>String(t??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const eur=n=>(+n||0).toLocaleString("es-ES",{minimumFractionDigits:2,maximumFractionDigits:2})+" €";
const hm=t=>new Date(t).toLocaleString("es-ES",{weekday:"short",hour:"2-digit",minute:"2-digit"});
const dES=s=>s?new Date(s+"T12:00").toLocaleDateString("es-ES",{day:"2-digit",month:"2-digit",year:"numeric"}):"";
const daysTo=d=>Math.round((new Date(d+"T12:00")-new Date(new Date().toISOString().slice(0,10)+"T12:00"))/864e5);
const toast=t=>{const d=document.createElement("div");d.className="toast";d.textContent=t;document.body.appendChild(d);setTimeout(()=>d.remove(),3000)};
function parseCode(c){c=String(c||"").trim().toLowerCase().replace(/\s+/g,"");const i=c.lastIndexOf("-");if(i<9)return null;const topic=c.slice(0,i),key=c.slice(i+1);if(!/^suhailw-[a-z0-9]+$/.test(topic)||!/^\d+$/.test(key))return null;return {topic,key}}
const b64=u=>{let s="";const a=new Uint8Array(u);for(let i=0;i<a.length;i+=8192)s+=String.fromCharCode.apply(null,a.subarray(i,i+8192));return btoa(s)};
const unb64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
let keyCache=null;
async function mKey(){if(keyCache)return keyCache;const base=await crypto.subtle.importKey("raw",new TextEncoder().encode(cfg.key),"PBKDF2",false,["deriveKey"]);keyCache=await crypto.subtle.deriveKey({name:"PBKDF2",salt:new TextEncoder().encode("suhail:"+cfg.topic),iterations:120000,hash:"SHA-256"},base,{name:"AES-GCM",length:256},false,["encrypt","decrypt"]);return keyCache}
async function gz(str){if(!window.CompressionStream)return new TextEncoder().encode(str);return new Uint8Array(await new Response(new Blob([str]).stream().pipeThrough(new CompressionStream("gzip"))).arrayBuffer())}
async function gunz(u){if(!window.DecompressionStream)return new TextDecoder().decode(u);return await new Response(new Blob([u]).stream().pipeThrough(new DecompressionStream("gzip"))).text()}
async function dec(txt){const [v,iv,c]=String(txt).split(".");if(v!=="S1")throw new Error("formato");const z=await crypto.subtle.decrypt({name:"AES-GCM",iv:unb64(iv)},await mKey(),unb64(c));return JSON.parse(await gunz(new Uint8Array(z)))}
async function enc(obj){const iv=crypto.getRandomValues(new Uint8Array(12));const c=await crypto.subtle.encrypt({name:"AES-GCM",iv},await mKey(),await gz(JSON.stringify(obj)));return "S1."+b64(iv)+"."+b64(c)}
async function hash(name,p){const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode("suhailw:"+cfg.topic+":"+String(name).toUpperCase()+":"+p));return [...new Uint8Array(b)].slice(0,12).map(x=>x.toString(16).padStart(2,"0")).join("")}

async function poll(since){const r=await fetch(NTFY+cfg.topic+"/json?poll=1&since="+since,{cache:"no-store"});if(!r.ok)throw new Error("HTTP");
  const lines=(await r.text()).split("\n").filter(Boolean).map(l=>{try{return JSON.parse(l)}catch(e){return null}}).filter(x=>x&&x.event==="message");
  const out=[];for(const l of lines){try{out.push(await dec(l.message))}catch(e){}}return out}
async function load(){
  if(!cfg)return;const rb=$("#rf");rb.textContent="…";
  try{const all=await poll("24h");const snaps=all.filter(x=>x.k==="snap");
    if(snaps.length){data=snaps[snaps.length-1];st.set("sw_last",JSON.stringify(data));err=""}
    else if(!data)err="Todavía no llega nada de la caja. Tiene que estar encendida, con internet y con la versión 9.6 o más nueva.";
  }catch(e){err="Sin conexión. Se muestra lo último que llegó."}
  if(me&&data&&!(data.users||[]).some(u=>u[0]===me.u&&u[1]===me.h)){me=null;st.del("sw_me");toast("Tu PIN ha cambiado. Vuelve a entrar.")}
  rb.textContent="Actualizar";render();
}
async function send(cmd){
  try{const r=await fetch(NTFY+cfg.topic+"-cmd",{method:"POST",body:await enc(Object.assign({u:me.u,h:me.h},cmd))});if(!r.ok)throw 0;return true}catch(e){toast("No se ha podido enviar. ¿Hay internet?");return false}
}
async function ask(cmd){
  const rid=Math.random().toString(36).slice(2,10),t0=Math.floor(Date.now()/1000)-2;
  if(!await send(Object.assign({rid},cmd)))return null;
  for(let i=0;i<20;i++){await new Promise(r=>setTimeout(r,2000));try{const res=(await poll(t0)).find(x=>x.k==="res"&&x.rid===rid);if(res)return res}catch(e){}}
  toast("La caja no contesta. ¿Está encendida y con internet?");return null;
}
function seenKey(){return "sw_seen_"+(me?me.u:"")}
function unread(){if(!data||!me)return 0;const seen=+st.get(seenKey())||0;return (data.msgs||[]).filter(m=>m[3]&&m[0]>seen).length}
function sub(){const s=$("#sub");if(!data){s.textContent="Supermercado Suhail";return}
  const ago=Math.round((Date.now()-data.at)/60000);s.textContent="Actualizado "+(ago<1?"ahora":ago<60?"hace "+ago+" min":hm(data.at));$("#shop").textContent="Suhail Trabajo"}

function vSetup(){return `<section class="card"><h2>Enlazar con la caja</h2>
  <p style="margin:0">Pide a Mohamed el <b>código de enlace</b>. Solo hay que ponerlo la primera vez.</p>

function vPer(){const P=(data.perm||[]).filter(x=>x[1]===me.u).slice().reverse();
  return `<section class="card hero"><p class="t">Descuento para un cliente</p></section>
  <section class="card big"><label for="pn">Producto</label><input id="pn" autocomplete="off" placeholder="Ej. aceite 1 litro">
   <div class="row"><div><label for="po">Precio antes (opcional)</label><input id="po" inputmode="decimal" autocomplete="off" placeholder="8,00"></div><div><label for="pp">Precio nuevo (opcional)</label><input id="pp" inputmode="decimal" autocomplete="off" placeholder="7,00"></div></div>
   <label>Cuántas</label><div class="qty"><button id="qm" type="button">−</button><b id="qv">${perQty}</b><button id="qp" type="button">+</button></div>
   <button class="btn xl" id="pb2">Enviar a Mohamed</button></section>
  <section class="card"><h2>Mis descuentos de hoy</h2><div class="list">${P.length?P.map(x=>`<div class="li"><span class="nm">${esc(x[2])} × ${x[5]}</span><b class="num ${x[6]?"ok":""}">${x[6]?"Hecho":"Esperando código"}</b><span class="s">${hm(x[0])} · ${x[3]?eur(x[3])+" → ":""}${x[4]?eur(x[4]):"precio a decidir"}</span></div>`).join(""):`<div class="empty">Hoy no has mandado ninguno.</div>`}</div>
   <p style="margin:0;font-size:12.5px;color:var(--muted)">Mohamed te contesta en Mensajes o te dice el código.</p></section>`}
let perQty=1;
let tkRes=null,tkQ="",masSub="pre",cogRes=null,cogQty=1,monReason="";
function vTk(){const M={e:"Efectivo",t:"Tarjeta",p:"No pagado",d:"Devolución"};
  return `<section class="card"><h2>Tickets</h2><label for="tq">Número de ticket, producto o fecha</label><input id="tq" autocomplete="off" value="${esc(tkQ)}" placeholder="Ej. 1532, coca-cola…" enterkeyhint="search">
   <input id="tdt" type="date" aria-label="Fecha"><div class="row"><button class="btn" id="tb"${busy?" disabled":""}>${busy?"Buscando…":"Buscar"}</button><button class="btn sec" id="tl"${busy?" disabled":""}>Últimos tickets</button></div></section>
  ${tkRes?`<section class="card"><h2>${tkRes.length?tkRes.length+" ticket"+(tkRes.length===1?"":"s"):"Sin resultados"}</h2><div>${tkRes.length?tkRes.map(t=>`<details style="border-top:1px solid var(--line);padding:9px 0"><summary style="display:flex;justify-content:space-between;gap:8px;list-style:none"><span><b class="num">nº ${t[0]}</b> · ${new Date(t[1]).toLocaleString("es-ES",{day:"2-digit",month:"2-digit",year:"2-digit",hour:"2-digit",minute:"2-digit"})}<br><span style="font-size:12.5px;color:var(--muted)">${esc(t[2])} · ${M[t[3]]||""}</span></span><b class="num">${eur(t[4])}</b></summary>${t[5].map(l=>`<div style="display:flex;justify-content:space-between;gap:8px;font-size:13.5px;color:var(--muted);padding:2px 0 2px 10px"><span>${esc(l[1])} × ${esc(l[0])}</span><span class="num">${eur(l[2])}</span></div>`).join("")}${t[6]>t[5].length?`<div style="font-size:13px;color:var(--muted);padding-left:10px">… y ${t[6]-t[5].length} más</div>`:""}</details>`).join(""):`<div class="empty">No hay tickets así.</div>`}</div></section>`:""}`}
function vCog(){return `<section class="card"><h2>Me he cogido algo</h2><p style="margin:0;font-size:13.5px;color:var(--muted)">Una bebida de la nevera, comida… Se quita del stock y no se paga. A Mohamed le llega un aviso.</p>
   <label for="cgq">Producto (nombre o código de barras)</label><input id="cgq" autocomplete="off" placeholder="Ej. coca-cola, agua…" enterkeyhint="search"><button class="btn sec" id="cgb"${busy?" disabled":""}>${busy?"Buscando…":"Buscar"}</button>
   ${cogRes?(cogRes.length?`<label>¿Cuántas?</label><div class="qty"><button id="cqm" type="button">−</button><b id="cqv">${cogQty}</b><button id="cqp" type="button">+</button></div><div class="list">${cogRes.map((p,i)=>`<div class="li"><span class="nm">${esc(p[0])}</span><button class="btn" style="width:auto;padding:9px 14px" data-cg="${i}">Me lo cojo</button><span class="s">${eur(p[1])}${p[2]==="kg"?"/kg":""}</span></div>`).join("")}</div>`:`<div class="empty">No hay ningún producto así.</div>`):""}</section>
  <section class="card big"><h2>He cogido dinero de la caja</h2><label for="mna">Cuánto</label><input id="mna" inputmode="decimal" autocomplete="off" placeholder="0,00">
   <label>Para qué (opcional)</label><div class="chips">${((data.out||[]).concat(["Adelanto de sueldo"])).filter((x,i,a)=>a.indexOf(x)===i).map(x=>`<button data-mr="${esc(x)}" aria-pressed="${monReason===x}">${esc(x)}</button>`).join("")}</div>
   <label for="mnn">Nota (opcional)</label><input id="mnn" autocomplete="off" placeholder="Ej. fruta del proveedor"><button class="btn xl" id="mnb">Apuntar dinero cogido</button></section>`}
function vMas(){const T={pre:["Precios",vPre],cad:["Caducidad",vCad],que:["Quejas",vQue]};
  return `<div class="chips">${Object.entries(T).map(([k,v])=>`<button data-ms="${k}" aria-pressed="${masSub===k}">${v[0]}</button>`).join("")}</div>`+T[masSub][1]()}
function vMsg(){const L=(data.msgs||[]).slice();
  return `<section class="card"><h2>Mensajes con Mohamed</h2><div class="msgs">${L.length?L.map(m=>{const mine=m[1].toUpperCase().startsWith(me.u.toUpperCase());return `<div class="m${mine?" me":""}${m[3]?" boss":""}"><small>${esc(m[3]?"Mohamed":m[1])} · ${hm(m[0])}</small><span>${esc(m[2])}</span></div>`}).join(""):`<div class="empty">No hay mensajes.</div>`}</div></section>
  <section class="card"><label for="mt">Escribe a Mohamed</label><textarea id="mt" rows="3" placeholder="Ej. ha llegado el pedido de Coca-Cola, falta cambio de 1 €…"></textarea><button class="btn" id="ms">Enviar</button>
  <p style="margin:0;font-size:12.5px;color:var(--muted)">Le llega en un momento. Lo que te conteste sale aquí.</p></section>`}
function vPre(){return `<section class="card"><h2>Consultar precio</h2><label for="pq">Nombre o código de barras</label><input id="pq" autocomplete="off" placeholder="Ej. coca, cuscús, 8410…" enterkeyhint="search"><button class="btn" id="pb"${busy?" disabled":""}>${busy?"Preguntando a la caja…":"Buscar"}</button></section>
  ${results?`<section class="card"><h2>${results.length} resultado${results.length===1?"":"s"}</h2><div class="list">${results.length?results.map(p=>`<div class="li"><span class="nm">${esc(p[0])}</span><span class="price">${eur(p[1])}${p[2]==="kg"?"/kg":""}</span>${p[3]||p[4]?`<span class="s">${p[3]?"Código "+esc(p[3]):""}${p[4]?(p[3]?" · ":"")+"Fría: "+eur(p[4]):""}</span>`:""}</div>`).join(""):`<div class="empty">No hay ningún producto así.</div>`}</div></section>`:""}`}
function vCad(){const L=data.cad||[];
  return `<section class="card"><h2>Apuntar caducidad</h2><label for="cq">Código de barras del producto</label><input id="cq" inputmode="numeric" autocomplete="off" placeholder="Código de barras"><label for="cd">Fecha de caducidad</label><input id="cd" type="date"><button class="btn" id="cb"${busy?" disabled":""}>${busy?"Guardando…":"Apuntar"}</button></section>
  <section class="card"><h2>Caducan pronto</h2><div class="list">${L.length?L.map(p=>{const n=daysTo(p[1]);return `<div class="li"><span class="nm">${esc(p[0])}</span><b class="num ${n<=3?"bad":""}">${n<0?"Caducado":n===0?"Hoy":n===1?"Mañana":"En "+n+" días"}</b><span class="s">${dES(p[1])} · ${eur(p[2])}${p[3]?" · "+esc(p[3]):""}</span></div>`}).join(""):`<div class="empty">Nada caduca pronto.</div>`}</div></section>`}
const FAL=["Coca-Cola","Agua","Pan","Leche","Huevos","Cuscús","Bolsas","Cambio de monedas","Papel del ticket"];
function vFal(){return `<section class="card"><h2>Avisar de lo que falta o hay que reponer</h2><div class="chips">${FAL.map(x=>`<button data-f="${esc(x)}" aria-pressed="${falta.includes(x)}">${esc(x)}</button>`).join("")}</div>
  <label for="ft">Otra cosa</label><input id="ft" autocomplete="off" placeholder="Ej. té Sultan, tomate frito"><button class="btn" id="fb">Avisar a Mohamed</button></section>`}
function vQue(){return `<section class="card"><h2>Queja de un cliente</h2><label for="qt">¿De qué se queja?</label><textarea id="qt" rows="4" placeholder="Ej. dice que el pan de ayer estaba duro"></textarea>
  <label for="qc">Cliente (nombre o teléfono, si lo da)</label><input id="qc" autocomplete="off"><button class="btn" id="qb">Guardar queja</button></section>`}

function render(){
  sub();const app=$("#app"),nav=$("#nav");
  if(!cfg){nav.hidden=true;app.innerHTML=vSetup();bindSetup();return}
  if(!me){nav.hidden=true;app.innerHTML=vLogin();bindLogin();return}
  nav.hidden=false;$$("nav button").forEach(b=>b.setAttribute("aria-current",b.dataset.v===view));
  const u=unread(),dm=$("#dMsg");dm.hidden=!u;dm.textContent=u;const nc=(data.cad||[]).filter(p=>daysTo(p[1])<=3).length,dc=$("#dCad");dc.hidden=!nc;dc.textContent=nc;
  const V={per:vPer,tk:vTk,cog:vCog,msg:()=>vMsg()+vFal(),mas:vMas}[view];
  app.innerHTML=(err?`<div class="stale">${esc(err)}</div>`:"")+V()+`<button class="btn sec" id="out">Salir (${esc(me.u)})</button>`;
  bindView();
}
function bindSetup(){$("#link").onclick=()=>{const c=parseCode($("#code").value);if(!c){toast("El código no es válido. Tiene que empezar por suhailw-");return}cfg=c;keyCache=null;st.set("sw_cfg",JSON.stringify(c));data=null;st.del("sw_last");load()}}
function bindLogin(){const ul=$("#unlink");if(ul)ul.onclick=()=>{cfg=null;st.del("sw_cfg");render()};
  $$("[data-u]").forEach(b=>b.onclick=()=>{pickU=b.dataset.u;pin="";render()});
  const ok=async()=>{const h=await hash(LOCK,pin);const u=(data.users||[]).find(x=>x[0]===LOCK);if(u&&u[1]===h){me={u:LOCK,h};st.set("sw_me",JSON.stringify(me));pin="";view="per";render()}else{pin="";toast("PIN incorrecto");render()}};
  $$("[data-k]").forEach(b=>b.onclick=()=>{const k=b.dataset.k;if(k==="⌫")pin=pin.slice(0,-1);else if(k==="OK"){ok();return}else if(pin.length<8)pin+=k;$("#pinS").textContent="•".repeat(pin.length)});
}
function bindView(){
  $("#out").onclick=()=>{me=null;st.del("sw_me");pickU=LOCK;render()};
  if(view==="per"){const n=v=>{const x=parseFloat(String(v).replace(",","."));return isNaN(x)?0:Math.round(x*100)/100};
    $("#qm").onclick=()=>{perQty=Math.max(1,perQty-1);$("#qv").textContent=perQty};$("#qp").onclick=()=>{perQty=Math.min(99,perQty+1);$("#qv").textContent=perQty};
    $("#pb2").onclick=async()=>{const name=$("#pn").value.trim(),old=n($("#po").value),price=n($("#pp").value);
      if(!name){toast("Escribe el producto");$("#pn").focus();return}if(price>0&&old&&price>=old){toast("El precio nuevo tiene que ser más bajo que el de antes");return}
      const b=$("#pb2");b.disabled=true;b.textContent="Enviando…";
      if(await send({t:"permiso",name,old,price,qty:perQty})){data.perm=(data.perm||[]).concat([[Date.now(),me.u,name.toUpperCase(),old,price,perQty,0]]);perQty=1;render();toast("Enviado a Mohamed")}else{b.disabled=false;b.textContent="Enviar a Mohamed"}}}
  if(view==="msg"){const L=data.msgs||[];if(L.length)st.set(seenKey(),String(Math.max(...L.map(m=>m[0]))));
    $("#ms").onclick=async()=>{const t=$("#mt").value.trim();if(!t){toast("Escribe el mensaje");return}if(await send({t:"nota",text:t})){$("#mt").value="";data.msgs=(data.msgs||[]).concat([[Date.now(),me.u+" (móvil)",t,0]]);render();toast("Enviado a Mohamed")}}}
  $$("[data-ms]").forEach(b=>b.onclick=()=>{masSub=b.dataset.ms;results=null;render()});
  if(view==="tk"){const go=async q=>{tkQ=q;busy=true;render();const r=await ask({t:"tickets",q});busy=false;tkRes=r?r.tk||[]:tkRes;render()};
    $("#tb").onclick=()=>{const d=$("#tdt").value,q=$("#tq").value.trim();go(q||d)};$("#tl").onclick=()=>go("");$("#tq").onkeydown=e=>{if(e.key==="Enter"){e.preventDefault();$("#tb").click()}}}
  if(view==="cog"){const n=v=>{const x=parseFloat(String(v).replace(",","."));return isNaN(x)?0:Math.round(x*100)/100};
    const find=async()=>{const q=$("#cgq").value.trim();if(!q)return;busy=true;cogRes=null;render();$("#cgq").value=q;const r=await ask({t:"buscar",q});busy=false;cogRes=r?r.items||[]:null;cogQty=1;render();$("#cgq").value=q};
    $("#cgb").onclick=find;$("#cgq").onkeydown=e=>{if(e.key==="Enter"){e.preventDefault();find()}};
    const qm=$("#cqm");if(qm){qm.onclick=()=>{cogQty=Math.max(1,cogQty-1);$("#cqv").textContent=cogQty};$("#cqp").onclick=()=>{cogQty=Math.min(24,cogQty+1);$("#cqv").textContent=cogQty}}
    $$("[data-cg]").forEach(b=>b.onclick=async()=>{const p=cogRes[+b.dataset.cg];b.disabled=true;b.textContent="…";const r=await ask({t:"consumo",q:p[3]||p[0],qty:cogQty});if(r){toast(r.msg);cogRes=null;cogQty=1;render()}else{b.disabled=false;b.textContent="Me lo cojo"}});
    $$("[data-mr]").forEach(b=>b.onclick=()=>{const a=$("#mna").value,nt=$("#mnn").value;monReason=b.dataset.mr;render();$("#mna").value=a;$("#mnn").value=nt});
    $("#mnb").onclick=async()=>{const a=n($("#mna").value);if(!(a>0)){toast("Pon cuánto has cogido");$("#mna").focus();return}
      const b=$("#mnb");b.disabled=true;b.textContent="Enviando…";const r=await ask({t:"dinero",amount:a,reason:monReason||"Otro",note:$("#mnn").value.trim()});
      if(r){toast(r.msg);monReason="";render()}else{b.disabled=false;b.textContent="Apuntar dinero cogido"}}}
  if(view==="mas"&&masSub==="pre"){const go=async()=>{const q=$("#pq").value.trim();if(!q)return;busy=true;results=null;render();$("#pq").value=q;const r=await ask({t:"buscar",q});busy=false;results=r?r.items||[]:null;render();$("#pq").value=q};
    $("#pb").onclick=go;$("#pq").onkeydown=e=>{if(e.key==="Enter"){e.preventDefault();go()}}}
  if(view==="mas"&&masSub==="cad"){$("#cb").onclick=async()=>{const q=$("#cq").value.trim(),d=$("#cd").value;if(!q||!d){toast("Pon el código y la fecha");return}busy=true;render();$("#cq").value=q;$("#cd").value=d;
    const r=await ask({t:"cad",q,d});busy=false;render();if(r){toast(r.msg);if(r.ok){$("#cq").value="";load()}else{$("#cq").value=q;$("#cd").value=d}}}}
  if(view==="msg"){$$("[data-f]").forEach(b=>b.onclick=()=>{const x=b.dataset.f;falta=falta.includes(x)?falta.filter(y=>y!==x):falta.concat(x);render()});
    $("#fb").onclick=async()=>{const o=$("#ft").value.trim();const L=falta.concat(o?[o]:[]);if(!L.length){toast("Marca o escribe lo que falta");return}if(await send({t:"falta",text:L.join(", ")})){falta=[];render();toast("Avisado a Mohamed")}}}
  if(view==="mas"&&masSub==="que"){$("#qb").onclick=async()=>{const t=$("#qt").value.trim();if(!t){toast("Escribe la queja");return}if(await send({t:"queja",text:t,client:$("#qc").value.trim()})){$("#qt").value="";$("#qc").value="";toast("Queja guardada. Le llega a Mohamed.")}}}
}
$$("nav button").forEach(b=>b.onclick=()=>{view=b.dataset.v;results=null;render();window.scrollTo(0,0)});
$("#rf").onclick=load;
render();if(cfg)load();
setInterval(()=>{if(cfg&&document.visibilityState==="visible"&&!busy)load()},60000);
document.addEventListener("visibilitychange",()=>{if(cfg&&document.visibilityState==="visible")load()});
</script></body></html>
