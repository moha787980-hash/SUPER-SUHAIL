<style>
:root{--bg:#F3F1EE;--card:#fff;--ink:#1A1414;--muted:#6B6260;--line:#E6DFDA;--red:#C8182A;--red2:#E0262F;--blue:#14307A;--gold:#D9A733;--ok:#1C8A4A;--warn:#B26A00;--f:-apple-system,"Segoe UI",system-ui,Roboto,Arial,sans-serif;--n:ui-monospace,"SF Mono",Menlo,Consolas,monospace}
@media (prefers-color-scheme:dark){:root{--bg:#120C0C;--card:#1E1616;--ink:#F5EFEC;--muted:#B0A39F;--line:#3A2C2B}}
[hidden]{display:none!important}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.4 var(--f);padding-bottom:calc(78px + env(safe-area-inset-bottom))}
header{background:linear-gradient(160deg,var(--red2),#9E0F18);color:#fff;padding:calc(12px + env(safe-area-inset-top)) 14px 12px;position:sticky;top:0;z-index:5;border-bottom:3px solid var(--gold)}
header .r{display:flex;align-items:center;gap:10px}
header .lg{height:48px;background:#fff;border-radius:8px;padding:3px 5px;flex:none}
header h1{margin:0;font-size:19px}#sub{font-size:12.5px;opacity:.9;margin-top:1px}
.hb{background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.35);color:#fff;border-radius:10px;padding:8px 12px;font:600 14px var(--f)}
main{padding:12px;display:grid;gap:12px;max-width:720px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;display:grid;gap:10px}
.card h2{margin:0;font-size:12.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.list{display:grid}.li{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:10px 0;border-top:1px solid var(--line)}.li:first-child{border-top:0}
.li .s{grid-column:1/-1;font-size:12.5px;color:var(--muted)}.li .nm{min-width:0;overflow-wrap:anywhere;font-weight:600}
.num{font-family:var(--n);font-variant-numeric:tabular-nums}.bad{color:var(--red)}.ok{color:var(--ok)}.wn{color:var(--warn)}
.empty{color:var(--muted);text-align:center;padding:12px}
.kp{display:grid;grid-template-columns:1fr 1fr;gap:10px}.kp div{background:var(--bg);border-radius:12px;padding:10px 12px}.kp small{display:block;color:var(--muted);font-size:12px}.kp b{font:700 20px var(--n)}
.kp .big{grid-column:1/-1;background:linear-gradient(160deg,var(--red2),#9E0F18);color:#fff}.kp .big small{color:#fff;opacity:.85}.kp .big b{font-size:32px}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);padding-bottom:env(safe-area-inset-bottom);z-index:5}
nav button{background:none;border:0;color:var(--muted);font:600 11.5px var(--f);padding:8px 2px 10px;display:grid;justify-items:center;gap:3px;position:relative}
nav button svg{width:24px;height:24px}nav button[aria-current=true]{color:var(--red)}
.dot{position:absolute;top:3px;left:calc(50% + 6px);background:var(--red);color:#fff;font-size:10.5px;border-radius:999px;padding:1px 6px}
input,textarea{width:100%;font:16px var(--f);padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink)}
label{font-size:13px;font-weight:600;color:var(--muted)}
.btn{background:var(--red);color:#fff;border:0;border-radius:12px;padding:13px 16px;font:700 15px var(--f);width:100%}.btn.sec{background:var(--bg);color:var(--ink);border:1px solid var(--line)}.btn.okb{background:var(--ok)}.btn:disabled{opacity:.6}
.row{display:flex;gap:8px}.row>*{flex:1}
.chips{display:flex;flex-wrap:wrap;gap:8px}.chips button{border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:999px;padding:9px 14px;font:600 14px var(--f)}
.chips button[aria-pressed=true]{background:var(--red);color:#fff;border-color:var(--red)}
.stale{background:#FFF4D6;color:#6E4A00;border:1px solid #F0D58A;border-radius:10px;padding:10px 12px;font-size:13.5px}
.good{background:#E3F4EA;color:#14532D;border:1px solid #A7D9B9;border-radius:10px;padding:10px 12px;font-size:13.5px}
.req{border:2px solid var(--line);border-radius:14px;padding:12px;display:grid;gap:8px}
.req.new{border-color:var(--red);box-shadow:0 0 0 3px rgba(200,24,42,.12)}
.req .t{font:800 19px/1.2 var(--f);overflow-wrap:anywhere}.req .m{font-size:13.5px;color:var(--muted)}
.req .pr{font:700 17px var(--n)}
.code{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--bg);border-radius:12px;padding:8px 12px}
.code b{font:800 40px var(--n);letter-spacing:.12em;color:var(--red)}.code small{color:var(--muted);font-size:12.5px}
.tag{display:inline-block;border-radius:999px;padding:3px 10px;font:700 12.5px var(--f);background:var(--bg)}
.tag.ok{background:#E3F4EA;color:#14532D}.tag.bad{background:#FDE4E6;color:#8A0F1B}.tag.wn{background:#FFF4D6;color:#6E4A00}
.bars{display:flex;align-items:flex-end;gap:3px;height:90px}.bars i{flex:1;background:var(--red2);border-radius:3px 3px 0 0;min-height:2px;opacity:.85}
.bl{display:flex;gap:3px;font-size:10px;color:var(--muted)}.bl span{flex:1;text-align:center}
.msgs{display:grid;gap:8px}.mm{max-width:88%;padding:9px 12px;border-radius:14px;background:var(--bg);display:grid;gap:2px}.mm.me{justify-self:end;background:var(--red);color:#fff}.mm small{font-size:11.5px;opacity:.75}
details summary{list-style:none;cursor:pointer}details summary::-webkit-details-marker{display:none}
.toast{position:fixed;left:50%;bottom:92px;transform:translateX(-50%);background:#1A1414;color:#fff;padding:10px 16px;border-radius:10px;font-size:14px;z-index:9;max-width:90vw;text-align:center}
</style></head><body>

<script>
"use strict";
const NTFY="https://ntfy.sh/";
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const st={get:k=>{try{return localStorage.getItem(k)}catch(e){return null}},set:(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}},del:k=>{try{localStorage.removeItem(k)}catch(e){}}};
const J=(k,d)=>{try{const v=JSON.parse(st.get(k)||"null");return v==null?d:v}catch(e){return d}};
let cfgB=J("sj_b",null),cfgW=J("sj_w",null);
let snap=J("sj_snap",null),wsnap=J("sj_wsnap",null),wcmd=J("sj_wcmd",[]),acted=J("sj_acted",{});
let view="des",err="",busy=false,avSub="av",lastNet=0,loading=false;
const esc=t=>String(t??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const eur=n=>(+n||0).toLocaleString("es-ES",{minimumFractionDigits:2,maximumFractionDigits:2})+" €";
const hm=t=>new Date(t).toLocaleTimeString("es-ES",{hour:"2-digit",minute:"2-digit"});
const dhm=t=>new Date(t).toLocaleString("es-ES",{weekday:"short",day:"numeric",hour:"2-digit",minute:"2-digit"});
const ago=t=>{const m=Math.round((Date.now()-t)/60000);return m<1?"ahora mismo":m<60?"hace "+m+" min":m<1440?"hace "+Math.floor(m/60)+" h "+(m%60)+" min":"el "+dhm(t)};
const dES=s=>s?new Date(s+"T12:00").toLocaleDateString("es-ES",{day:"2-digit",month:"2-digit"}):"";
const daysTo=d=>Math.round((new Date(d+"T12:00")-new Date(new Date().toISOString().slice(0,10)+"T12:00"))/864e5);
const toast=t=>{const d=document.createElement("div");d.className="toast";d.textContent=t;document.body.appendChild(d);setTimeout(()=>d.remove(),3200)};
const nm=u=>String(u||"").replace(/\s*\(móvil\)\s*$/i,"");
const cap=s=>{s=String(s||"").toLowerCase();return s.charAt(0).toUpperCase()+s.slice(1)};

/* ---------- cifrado: igual que la caja ---------- */
const b64=u=>{let s="";const a=new Uint8Array(u);for(let i=0;i<a.length;i+=8192)s+=String.fromCharCode.apply(null,a.subarray(i,i+8192));return btoa(s)};
const unb64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const kc={};
async function kOf(c){const id=c.topic+"|"+c.key;if(kc[id])return kc[id];const base=await crypto.subtle.importKey("raw",new TextEncoder().encode(c.key),"PBKDF2",false,["deriveKey"]);return kc[id]=await crypto.subtle.deriveKey({name:"PBKDF2",salt:new TextEncoder().encode("suhail:"+c.topic),iterations:120000,hash:"SHA-256"},base,{name:"AES-GCM",length:256},false,["encrypt","decrypt"])}
async function gz(str){if(!window.CompressionStream)return new TextEncoder().encode(str);return new Uint8Array(await new Response(new Blob([str]).stream().pipeThrough(new CompressionStream("gzip"))).arrayBuffer())}
async function gunz(u){if(!window.DecompressionStream)return new TextDecoder().decode(u);return await new Response(new Blob([u]).stream().pipeThrough(new DecompressionStream("gzip"))).text()}
async function dec(c,txt){const [v,iv,x]=String(txt).split(".");if(v!=="S1")throw 0;const z=await crypto.subtle.decrypt({name:"AES-GCM",iv:unb64(iv)},await kOf(c),unb64(x));return JSON.parse(await gunz(new Uint8Array(z)))}
async function enc(c,obj){const iv=crypto.getRandomValues(new Uint8Array(12));const x=await crypto.subtle.encrypt({name:"AES-GCM",iv},await kOf(c),await gz(JSON.stringify(obj)));return "S1."+b64(iv)+"."+b64(x)}
function parseCode(s,pre){s=String(s||"").trim().toLowerCase().replace(/\s+/g,"");const i=s.lastIndexOf("-");if(i<8)return null;const topic=s.slice(0,i),key=s.slice(i+1);if(!new RegExp("^"+pre+"-[a-z0-9]+$").test(topic)||!/^\d{4,}$/.test(key))return null;return {topic,key}}
(function(){const h=decodeURIComponent(location.hash.slice(1));const m=h.match(/w=([a-z0-9-]+)/i);if(m){const w=parseCode(m[1],"suhailw");if(w){cfgW=w;st.set("sj_w",JSON.stringify(w))}}const b=h.match(/(?:^|&)b=([a-z0-9-]+)/i);if(b){const x=parseCode(b[1],"suhail");if(x){cfgB=x;st.set("sj_b",JSON.stringify(x))}}})();

/* ---------- leer la caja (una sola petición para los 3 canales) ---------- */
async function load(){
  if(!cfgB||loading)return;loading=true;const rb=$("#rf");rb.textContent="…";
  const topics=[cfgB.topic].concat(cfgW?[cfgW.topic,cfgW.topic+"-cmd"]:[]);
  try{
    const r=await fetch(NTFY+topics.join(",")+"/json?poll=1&since=24h",{cache:"no-store"});if(!r.ok)throw new Error("HTTP "+r.status);
    const lines=(await r.text()).split("\n").filter(Boolean).map(l=>{try{return JSON.parse(l)}catch(e){return null}}).filter(x=>x&&x.event==="message");
    let bs=null,ws=null;const cmds=[];
    for(const l of lines){
      if(l.topic===cfgB.topic){try{const o=await dec(cfgB,l.message);if(o&&o.v&&!o.k&&(!bs||o.at>=bs.at))bs=o}catch(e){}}
      else if(cfgW&&l.topic===cfgW.topic){try{const o=await dec(cfgW,l.message);if(o&&o.k==="snap"&&(!ws||o.at>=ws.at))ws=o}catch(e){}}
      else if(cfgW&&l.topic===cfgW.topic+"-cmd"){try{const o=await dec(cfgW,l.message);if(o&&o.t)cmds.push(Object.assign({_at:l.time*1000,_id:l.id},o))}catch(e){}}
    }
    if(bs&&(!snap||bs.at>=snap.at)){snap=bs;st.set("sj_snap",JSON.stringify(snap))}
    if(ws&&(!wsnap||ws.at>=wsnap.at)){wsnap=ws;st.set("sj_wsnap",JSON.stringify(wsnap))}
    if(cfgW){const U=(wsnap&&wsnap.users)||[];const okU=c=>!U.length||U.some(u=>u[0].toUpperCase()===String(c.u||"").toUpperCase()&&u[1]===c.h);
      wcmd=cmds.filter(okU).map(c=>{const o=Object.assign({},c);delete o.h;return o});st.set("sj_wcmd",JSON.stringify(wcmd))}
    err=snap?"":"Todavía no ha llegado nada de la caja a tu app.";lastNet=Date.now();
  }catch(e){err="Sin conexión. Se ve lo último que llegó."}
  loading=false;rb.textContent="Actualizar";render();
}

function reqs(){
  const L=[],day=Date.now()-24*3600e3;
  wcmd.filter(c=>c.t==="permiso"&&c.name&&c._at>day).forEach(c=>L.push({id:"a"+c._id,at:c._at,user:nm(c.u),name:String(c.name).toUpperCase().slice(0,60),old:+c.old>0?+c.old:0,price:+c.price>0?+c.price:0,qty:Math.max(1,Math.round(+c.qty||1)),app:1}));
  ((wsnap&&wsnap.perm)||[]).forEach(p=>{const n30=String(p[2]).toUpperCase();
    let r=L.find(x=>!x.caja&&x.user.toUpperCase()===String(p[1]).toUpperCase()&&x.name.slice(0,30)===n30&&Math.abs(x.at-p[0])<15*60e3);
    if(!r){r={id:"p"+p[0]+p[2],at:p[0],user:p[1],name:n30,old:+p[3]||0,price:+p[4]||0,qty:+p[5]||1};L.push(r)}
    r.caja=1;r.cajaAt=p[0];r.used=!!p[6]});
  ((snap&&snap.notes)||[]).forEach(n=>{const t=String(n[2]),m=t.match(/CÓDIGO (\d{4})/);if(!m)return;
    if(t.startsWith("DESCUENTO CLIENTE: ")){const c=L.filter(x=>!x.code&&t.startsWith("DESCUENTO CLIENTE: "+x.name.slice(0,30))).sort((a,b)=>Math.abs((a.cajaAt||a.at)-n[0])-Math.abs((b.cajaAt||b.at)-n[0]))[0];
      if(c){c.code=m[1];c.caja=1}else L.push({id:"n"+n[0],at:n[0],user:nm(n[1]),name:t.slice(19).split(/ de \d| a \d| · /)[0],code:m[1],caja:1,qty:(t.match(/se lleva (\d+)/)||[])[1]||1,txt:t})}
    else if(t.startsWith("BAJAR PRECIO: ")){const mm=t.match(/^BAJAR PRECIO: (.+?) de ([\d.,]+)\s?€ a ([\d.,]+)\s?€/);const pn=s=>+String(s).replace(/\./g,"").replace(",",".");
      L.push({id:"n"+n[0],at:n[0],user:nm(n[1]),name:mm?mm[1]:t.slice(14).split(" · ")[0],old:mm?pn(mm[2]):0,price:mm?pn(mm[3]):0,qty:1,code:m[1],caja:1,enCaja:1,kg:/el kilo/.test(t)})}});
  return L.sort((a,b)=>b.at-a.at);
}

  $$("[data-as]").forEach(b=>b.onclick=()=>{avSub=b.dataset.as;render()});
  const ms=$("#ms");if(ms)ms.onclick=async()=>{const t=$("#mt").value.trim();if(!t)return;ms.disabled=true;if(await sendCaja({t:"nota",text:t})){$("#mt").value="";toast("Enviado")}ms.disabled=false};
  const pb=$("#pb");if(pb)pb.onclick=async()=>{const q=$("#pq").value.trim(),p=+String($("#pp").value).replace(",",".");if(!q||!(p>0)){toast("Pon el producto y el precio");return}
    if(!confirm("¿Cambiar el precio de "+q+" a "+eur(p)+"? Se cambia para siempre en la caja."))return;if(await sendCaja({t:"precio",q,p})){$("#pq").value="";$("#pp").value="";toast("Enviado. La caja lo cambia en 1-2 min.")}};
  const cf=$("#cfg");if(cf)cf.onclick=()=>{view="cfg";render()};
}
$$("nav button").forEach(b=>b.onclick=()=>{view=b.dataset.v;window.scrollTo(0,0);render()});
$("#rf").onclick=()=>load();
setInterval(()=>{if(document.visibilityState==="visible")load()},30000);
setInterval(()=>{if(document.visibilityState==="visible"&&!$("input:focus,textarea:focus"))render()},60000);
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible"&&Date.now()-lastNet>10000)load()});
// limpiar respuestas viejas
(()=>{const t=Date.now()-3*864e5;let ch=false;for(const k in acted)if(acted[k].at<t){delete acted[k];ch=true}if(ch)st.set("sj_acted",JSON.stringify(acted))})();
render();load();
</script></body></html>
